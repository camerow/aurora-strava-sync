name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
  WEB_URL: ${{ github.ref_name == 'main' && 'https://sendtally.com' || 'https://staging.sendtally.com' }}
  API_URL: ${{ github.ref_name == 'main' && 'https://api.sendtally.com' || 'https://api-staging.sendtally.com' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy-sync-service:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require runtime secrets
        working-directory: packages/sync-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          ../../.github/scripts/require-secrets.sh ${{ env.DEPLOY_ENV }}
          TOKEN_KEY CLERK_SECRET_KEY STRAVA_CLIENT_ID STRAVA_CLIENT_SECRET STRAVA_WEBHOOK_VERIFY_TOKEN
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/sync-service
          command: d1 migrations apply DB --env ${{ env.DEPLOY_ENV }} --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/sync-service
          command: deploy --env ${{ env.DEPLOY_ENV }}
      - name: Smoke check the deployed API
        run: .github/scripts/smoke.sh "${{ env.API_URL }}/health"

  deploy-web:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require runtime secrets
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../.github/scripts/require-secrets.sh ${{ env.DEPLOY_ENV }} CLERK_SECRET_KEY
      - run: pnpm --filter @sendtally/web build
        env:
          CLOUDFLARE_ENV: ${{ env.DEPLOY_ENV }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
      - name: Smoke check the deployed site
        run: .github/scripts/smoke.sh "${{ env.WEB_URL }}"
