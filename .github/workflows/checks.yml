name: Checks

on:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/cli-go/go.mod
          cache-dependency-path: tools/cli-go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - name: Test (one retry for the vitest-pool-workers isolated-storage flake)
        run: pnpm test || pnpm test
      - run: pnpm format:check
      - run: go test ./...
        working-directory: tools/cli-go
      - name: Validate D1 migrations apply on a fresh database
        run: npx wrangler d1 migrations apply DB --local
        working-directory: packages/sync-service
